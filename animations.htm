<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animations | Dev Tools Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      font-size: 2em;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 40px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 30px;
      width: 220px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: translateY(-8px);
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .card i {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .card a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 1.1em;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>✨ Animations</header>
  <div class="container">
    <div class="card">
      <a href="https://animate.style/" target="_blank">
        <i class="fa fa-bolt"></i>
        <div>Animate.css</div>
      </a>
    </div>
    <div class="card">
      <a href="https://animista.net/" target="_blank">
        <i class="fa fa-magic"></i>
        <div>Animista</div>
      </a>
    </div>
    <div class="card">
      <a href="https://lottiefiles.com/" target="_blank">
        <i class="fa fa-shapes"></i>
        <div>LottieFiles</div>
      </a>
    </div>
    <div class="card">
      <a href="https://motion.dev/" target="_blank">
        <i class="fa fa-wave-square"></i>
        <div>Motion.dev</div>
      </a>
    </div>
    <div class="card">
      <a href="https://keyframes.app/" target="_blank">
        <i class="fa fa-play"></i>
        <div>Keyframes.app</div>
      </a>
    </div>
    <div class="card">
      <a href="https://rive.app/" target="_blank">
        <i class="fa fa-circle-notch"></i>
        <div>Rive</div>
      </a>
    </div>
  </div>
  <footer>Back to <a href="/index.htm" style="color:#fff; text-decoration:underline;">Home</a></footer>
</body>
</html>
