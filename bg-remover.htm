<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Remover Tools</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 40px;
      font-size: 2.5rem;
      text-align: center;
      letter-spacing: 1px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
      width: 90%;
      max-width: 1200px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      text-align: center;
      padding: 30px 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .card i {
      font-size: 45px;
      margin-bottom: 15px;
      color: #00bcd4;
    }

    .card a {
      text-decoration: none;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: block;
    }

    .back-home {
      margin-top: 20px;
      text-align: center;
    }

    .back-home a {
      color: #00bcd4;
      text-decoration: none;
      font-weight: 600;
    }

    .back-home a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1><i class="fa fa-scissors"></i> Background Remover Tools</h1>

  <div class="container">
    <div class="card">
      <i class="fa fa-cut"></i>
      <a href="https://www.remove.bg/" target="_blank">Remove.bg</a>
    </div>

    <div class="card">
      <i class="fa fa-eraser"></i>
      <a href="https://www.slazzer.com/" target="_blank">Slazzer</a>
    </div>

    <div class="card">
      <i class="fa fa-image"></i>
      <a href="https://www.cleanup.pictures/" target="_blank">Cleanup.pictures</a>
    </div>

    <div class="card">
      <i class="fa fa-wand-magic-sparkles"></i>
      <a href="https://photoscissors.com/" target="_blank">PhotoScissors</a>
    </div>

    <div class="card">
      <i class="fa fa-layer-group"></i>
      <a href="https://www.erase.bg/" target="_blank">Erase.bg</a>
    </div>

    <div class="card">
      <i class="fa fa-circle-half-stroke"></i>
      <a href="https://www.fotor.com/features/background-remover/" target="_blank">Fotor Background Remover</a>
    </div>
  </div>

  <div class="back-home">
    <a href="/index.htm"><i class="fa fa-arrow-left"></i> Back to Home</a>
  </div>
</body>
</html>
